<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>광수호텔 해운대 | 공식 홈페이지</title>
<meta name="description" content="해운대해수욕장 도보 5분, 광수호텔 공식 홈페이지. 공식 예약 사이트 kwangsuhotel.com">
<link rel="canonical" href="https://kwangsuhotel.com/">
<meta property="og:title" content="광수호텔 해운대 | 공식 홈페이지">
<meta property="og:description" content="해운대해수욕장 도보 5분 · 공식 홈페이지 예약">
<meta property="og:url" content="https://kwangsuhotel.com/">
<meta property="og:image" content="https://kwangsuhotel.com/images/hero-1.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f2a3d'/%3E%3Ctext x='32' y='44' font-family='Georgia' font-size='34' fill='%23c9a86a' text-anchor='middle'%3EK%3C/text%3E%3C/svg%3E">
</head>
<body>

<section class="hero" id="top" style="padding:0">
  <div class="slide on" style="background-image:url(/images/hero-1.jpg),var(--ph-1)"></div>
  <div class="slide" style="background-image:url(/images/hero-2.jpg),var(--ph-2)"></div>
  <div class="slide" style="background-image:url(/images/hero-3.jpg),var(--ph-3)"></div>
  <div class="wrap">
    <div class="eyebrow" data-i18n="hero.eyebrow"></div>
    <h1 data-i18n="hero.title"></h1>
    <p data-i18n="hero.sub"></p>
    <form class="bar" id="bar" action="/booking/" method="get">
      <label><span data-i18n="bar.checkin"></span><input type="date" name="in" id="b-in" required></label>
      <label><span data-i18n="bar.checkout"></span><input type="date" name="out" id="b-out" required></label>
      <label><span data-i18n="bar.adults"></span><select name="a" id="b-a"><option>1</option><option selected>2</option><option>3</option></select></label>
      <label><span data-i18n="bar.children"></span><select name="c" id="b-c"><option selected>0</option><option>1</option><option>2</option></select></label>
      <button class="btn btn-navy" type="submit" data-i18n="bar.search"></button>
    </form>
  </div>
</section>

<section id="about">
  <div class="wrap about-grid">
    <div>
      <div class="sec-hd" style="margin-bottom:0">
        <div class="eyebrow" data-i18n="about.eyebrow"></div>
        <h2 data-i18n="about.title"></h2>
        <p data-i18n="about.lead"></p>
      </div>
      <div class="keys">
        <div class="key"><i>1</i><div><b data-i18n="about.k1t"></b><span data-i18n="about.k1d"></span></div></div>
        <div class="key"><i>2</i><div><b data-i18n="about.k2t"></b><span data-i18n="about.k2d"></span></div></div>
        <div class="key"><i>3</i><div><b data-i18n="about.k3t"></b><span data-i18n="about.k3d"></span></div></div>
      </div>
    </div>
    <div class="about-img" style="background-image:url(/images/about.jpg),var(--ph-2)"><span class="bath" style="background-image:url(/images/bath.jpg),var(--ph-3)"></span></div>
  </div>
</section>

<section class="rooms" id="rooms">
  <div class="wrap">
    <div class="sec-hd">
      <div class="eyebrow" data-i18n="rooms.eyebrow"></div>
      <h2 data-i18n="rooms.title"></h2>
      <p data-i18n="rooms.lead"></p>
    </div>
    <div class="room-grid" id="room-grid"></div>
  </div>
</section>

<section id="facilities">
  <div class="wrap">
    <div class="sec-hd">
      <div class="eyebrow" data-i18n="fac.eyebrow"></div>
      <h2 data-i18n="fac.title"></h2>
    </div>
    <div class="fac-grid">
      <div class="fac"><div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v8a3 3 0 0 0 6 0V3M9 3v18M17 3c-2 2-2 6 0 8v10"/></svg></div><div class="t"><h3 data-i18n="fac.f1t"></h3><p data-i18n="fac.f1d"></p></div></div>
      <div class="fac"><div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h13v5a6 6 0 0 1-6 6H10a6 6 0 0 1-6-6V8zM17 10h2a2 2 0 0 1 0 4h-2M8 2v3M12 2v3"/></svg></div><div class="t"><h3 data-i18n="fac.f2t"></h3><p data-i18n="fac.f2d"></p></div></div>
      <div class="fac"><div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l2-5h14l2 5M4 9v11h16V9M3 9h18M9 20v-6h6v6"/></svg></div><div class="t"><h3 data-i18n="fac.f3t"></h3><p data-i18n="fac.f3d"></p></div></div>
      <div class="fac"><div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M10 17V8h3a3 3 0 0 1 0 6h-3"/></svg></div><div class="t"><h3 data-i18n="fac.f4t"></h3><p data-i18n="fac.f4d"></p></div></div>
    </div>
    <p class="note" data-i18n="fac.note"></p>
  </div>
</section>

<section class="loc" id="location">
  <div class="wrap">
    <div class="sec-hd">
      <div class="eyebrow" data-i18n="loc.eyebrow"></div>
      <h2 data-i18n="loc.title"></h2>
    </div>
    <div class="loc-grid">
      <dl>
        <div><dt data-i18n="loc.addr"></dt><dd id="loc-addr"></dd></div>
        <div><dt data-i18n="loc.tel"></dt><dd id="loc-tel"></dd></div>
        <div><dt data-i18n="loc.time"></dt><dd id="loc-time"></dd></div>
        <div><dt>ACCESS</dt><dd><ul><li data-i18n="loc.t1"></li><li data-i18n="loc.t2"></li><li data-i18n="loc.t3"></li></ul></dd></div>
        <div><a class="btn btn-sand" id="loc-map" target="_blank" rel="noopener" data-i18n="loc.map"></a></div>
      </dl>
      <div class="map"><iframe id="map" loading="lazy" title="map" referrerpolicy="no-referrer-when-downgrade"></iframe></div>
    </div>
  </div>
</section>

<script type="module" src="/js/main.js"></script>
<div style="position:fixed;left:0;right:0;bottom:0;z-index:90;background:#0a1d2a;color:#fff;font:13px/1.4 sans-serif;padding:9px 16px;text-align:center"><b style="color:#c9a86a">테스트 사이트</b> · 오픈 전 검토용입니다. 요금은 임시값이며 결제는 토스페이먼츠 테스트 모드(실제 청구 없음)입니다.</div>
</body>
</html>
